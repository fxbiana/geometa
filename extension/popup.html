<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GeoMeta</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <p class="brand">Geo<span>Meta</span></p>
      <p class="note">
        Sends this view to your local analysis API and shows the countries the
        claims support. It does not submit a GeoGuessr guess.
      </p>
    </header>

    <label class="field">
      API
      <input id="api-base" type="url" value="http://127.0.0.1:8000" spellcheck="false" />
    </label>

    <p id="health" class="health">API not checked</p>

    <div class="actions">
      <button id="check-api" type="button">Check API</button>
      <button id="analyze-tab" type="button">Analyze this tab</button>
      <label class="file-button">
        Choose image
        <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" />
      </label>
    </div>

    <p id="message" class="message" role="status"></p>
    <section id="results"></section>

    <script src="present.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
